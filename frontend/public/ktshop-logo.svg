<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <!-- Emblem Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ── EMBLEM ── -->
  <g transform="translate(6, 6)">
    <!-- Base Shield / Rounded Polygon -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#bgGrad)" filter="url(#glow)" opacity="0.95" />
    
    <!-- Tech Frame Inner Border -->
    <rect x="2" y="2" width="44" height="44" rx="10" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

    <!-- Stylized Monogram "KT" & Laptop Fusion -->
    <!-- Laptop screen silhouette -->
    <path d="M12 11h24a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V13a2 2 0 0 1 2-2z" fill="rgba(15, 23, 42, 0.45)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />
    
    <!-- Monogram K -->
    <path d="M16 14v12M16 20l6-6M17 19.5l6.5 6.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Monogram T with Cyan Accent -->
    <path d="M25 14h8M29 14v12" stroke="url(#accentGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Laptop Base Stand -->
    <path d="M8 32h32l-2 3H10l-2-3z" fill="url(#accentGrad)" opacity="0.9" />
    <line x1="21" y1="33.5" x2="27" y2="33.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- ── TYPOGRAPHY ── -->
  <g transform="translate(66, 12)">
    <!-- Brand Wordmark KT -->
    <text x="0" y="27" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)">
      KT
    </text>
    
    <!-- Brand Wordmark SHOP -->
    <text x="42" y="27" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5" fill="#f59e0b">
      SHOP
    </text>

    <!-- Subtitle Slogan -->
    <text x="1" y="40" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.8" fill="#64748b">
      LAPTOP CHÍNH HÃNG
    </text>

    <!-- Accent Dot -->
    <circle x="120" y="22" cx="132" cy="22" r="3.5" fill="#06b6d4" />
  </g>
</svg>
