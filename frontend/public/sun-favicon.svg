<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Sun Gradient -->
    <linearGradient id="sunCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="sunRayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Sun -->
  <circle cx="32" cy="32" r="16" fill="#f59e0b" opacity="0.25" filter="url(#sunGlow)" />

  <!-- 8 Sun Rays -->
  <g stroke="url(#sunRayGrad)" stroke-width="4" stroke-linecap="round">
    <!-- N, S, E, W -->
    <line x1="32" y1="6" x2="32" y2="13" />
    <line x1="32" y1="51" x2="32" y2="58" />
    <line x1="58" y1="32" x2="51" y2="32" />
    <line x1="13" y1="32" x2="6" y2="32" />
    <!-- NE, NW, SE, SW -->
    <line x1="50.4" y1="13.6" x2="45.4" y2="18.6" />
    <line x1="18.6" y1="18.6" x2="13.6" y2="13.6" />
    <line x1="50.4" y1="50.4" x2="45.4" y2="45.4" />
    <line x1="18.6" y1="45.4" x2="13.6" y2="50.4" />
  </g>

  <!-- Sun Central Core -->
  <circle cx="32" cy="32" r="14" fill="url(#sunCoreGrad)" filter="url(#sunGlow)" />

  <!-- Inner Shine Arc -->
  <path d="M 23 25 A 10 10 0 0 1 39 25" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.65" />
</svg>
