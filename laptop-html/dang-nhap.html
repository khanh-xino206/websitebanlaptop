<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Tài Khoản - KTSHOP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- HEADER SIMPLE -->
    <header class="py-6 px-4 max-w-7xl mx-auto w-full flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2.5">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-700 to-indigo-500 rounded-xl flex items-center justify-center text-white text-xl shadow-md">
                <i class="fa-solid fa-laptop-code"></i>
            </div>
            <div class="text-2xl font-black text-blue-700">KT<span class="text-slate-900">SHOP</span></div>
        </a>
        <a href="index.html" class="text-xs text-slate-500 hover:text-blue-600 flex items-center gap-1 font-medium">
            <i class="fa-solid fa-house"></i> Về trang chủ
        </a>
    </header>

    <!-- FORM BOX -->
    <main class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200/80 max-w-md w-full space-y-6">
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-black text-slate-900">Đăng Nhập</h1>
                <p class="text-xs text-slate-500">Chào mừng bạn quay lại với hệ thống KTSHOP Laptop</p>
            </div>

            <form onsubmit="event.preventDefault(); alert('Đăng nhập thành công!'); window.location.href='index.html';" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Địa chỉ Email</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-3.5 top-3 text-slate-400"></i>
                        <input type="email" required placeholder="nhapemail@gmail.com" value="user@ktshop.vn" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 transition">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-bold text-slate-700">Mật khẩu</label>
                        <a href="#" class="text-blue-600 hover:underline text-[11px]">Quên mật khẩu?</a>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400"></i>
                        <input type="password" required placeholder="••••••••" value="123456" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 transition">
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <input type="checkbox" id="remember" checked class="rounded text-blue-600 focus:ring-0">
                    <label for="remember" class="text-slate-600 cursor-pointer">Ghi nhớ đăng nhập trên thiết bị này</label>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition text-sm">
                    ĐĂNG NHẬP
                </button>
            </form>

            <div class="relative flex items-center justify-center border-t border-slate-200 pt-4">
                <span class="bg-white px-3 text-xs text-slate-400 absolute">Hoặc tiếp tục với</span>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button class="flex items-center justify-center gap-2 py-2.5 border border-slate-200 rounded-xl text-xs font-semibold hover:bg-slate-50 transition">
                    <i class="fa-brands fa-google text-red-500"></i> Google
                </button>
                <button class="flex items-center justify-center gap-2 py-2.5 border border-slate-200 rounded-xl text-xs font-semibold hover:bg-slate-50 transition">
                    <i class="fa-brands fa-facebook text-blue-600"></i> Facebook
                </button>
            </div>

            <div class="text-center text-xs text-slate-500">
                Chưa có tài khoản KTSHOP? 
                <a href="dang-ky.html" class="text-blue-600 font-bold hover:underline">Đăng ký ngay</a>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-400">
        © 2026 KTSHOP Laptop. Dự án chuyên đề Frontend - Huỳnh Tấn Phát (501250508).
    </footer>
</body>
</html>
